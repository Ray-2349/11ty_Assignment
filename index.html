<!doctype html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" 
           content="width=device-width, 
           user-scalable=no, 
           initial-scale=1.0, 
           maximum-scale=1.0, 
           minimum-scale=1.0">
     <meta http-equiv="X-UA-Compatible" 
           content="ie=edge">
           <link rel="stylesheet" href="css/CSS.css">
           <script type="module" src="js/is-land.js"></script>
     <title></title>
</head>
<body>

 <h2>Hello</h2>
<p>Welcome to my eleventy.</p>
<is-land on:visible>
<div id="counter" v-scope="{ count:0 }">
<p>Count: <span v-text="count"><span></p>
<button @click="count++">Add one</button>
<div>
<template data-island>
<script type="module">
    import { createApp } from './js/petite-vue.js'
    createApp().mount('#counter')
</script>
</template>
</is-land>
<is-land on:visible>
  <div id="counters">
    <div v-scope="Counter({ initialCount: 5 })">
      <p>Count: <span v-text="count"></span></p>
      <button @click="increment">+</button>
    </div>
    <div v-scope="Counter({ initialCount: 20 })">
      <p>Count: <span v-text="count"></span></p>
      <button @click="increment">+</button>
    </div>
  </div>
  <template data-island>
    <script type="module">
      import { createApp } from './js/petite-vue.js'
<p>function Counter(props) {
return {
count: props.initialCount,
increment() { this.count++ }
}
}</p>
<p>createApp({ Counter }).mount('#counters')
</script>
</template></p>
</is-land>
<is-land on:visible>
  <template data-island>
    <div id="scene-container"></div>
    <script type="module" src="js/threeScene.js"></script>
  </template>
</is-land>
    
</body>
</html>
